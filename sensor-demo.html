<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Monitor (Test Project) Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
        .demo-container { display: flex; height: 100vh; flex-direction: column; }
        
        .header { background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%); padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; font-weight: 600; }
        .close-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; cursor: pointer; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
        .close-btn:hover { background: rgba(255,255,255,0.3); }

        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 200px; background: #1e293b; border-right: 1px solid #334155; padding: 12px; overflow-y: auto; }
        .sensor-list-item { padding: 8px 12px; background: #334155; margin-bottom: 8px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .sensor-list-item:hover { background: #475569; }
        .sensor-list-item.active { background: #2563eb; color: #fff; border-left: 3px solid #60a5fa; padding-left: 9px; }
        .sensor-label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; margin-top: 12px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: auto; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; padding: 12px; background: #1e293b; border-bottom: 1px solid #334155; }
        .metric-card { background: #334155; padding: 12px; border-radius: 6px; }
        .metric-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .metric-value { font-size: 18px; font-weight: 600; color: #60a5fa; margin-top: 4px; }
        .metric-unit { font-size: 11px; color: #64748b; }

        .charts-container { flex: 1; padding: 20px; overflow: auto; }
        .chart-box { background: #1e293b; padding: 16px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 16px; position: relative; height: 250px; }
        .chart-title { font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; }

        .status-bar { background: #0f172a; border-top: 1px solid #334155; padding: 8px 16px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
<div class="demo-container">
    <div class="header">
        <h1><i class="fas fa-chart-line"></i> Sensor Monitor <span style="font-size:12px;font-weight:600;opacity:.7;margin-left:8px;">test project</span></h1>
        <button class="close-btn" onclick="window.location.href='index.html#projects'">← Back to Portfolio</button>
    </div>
    
    <div class="workspace">
        <div class="sidebar">
            <div class="sensor-label">Sensors</div>
            <div class="sensor-list-item active" onclick="selectSensor('temp')"><i class="fas fa-thermometer-half"></i> Temperature</div>
            <div class="sensor-list-item" onclick="selectSensor('humidity')"><i class="fas fa-droplet"></i> Humidity</div>
            <div class="sensor-list-item" onclick="selectSensor('pressure')"><i class="fas fa-gauge"></i> Pressure</div>
            <div class="sensor-list-item" onclick="selectSensor('co2')"><i class="fas fa-wind"></i> CO2</div>
            
            <div class="sensor-label" style="margin-top:16px;">Status</div>
            <div class="sensor-list-item"><span style="color:#10b981;">●</span> All Online</div>
            <div class="sensor-list-item"><span style="color:#64748b;">Last Update:</span> Just now</div>
        </div>

        <div class="main-content">
            <div class="metrics-grid" id="metricsGrid"></div>
            <div class="charts-container">
                <div class="chart-box">
                    <div class="chart-title">24-Hour Trend</div>
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="chart-box">
                    <div class="chart-title">Distribution</div>
                    <canvas id="distChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar">Test project • sample data, not live sensors • <strong id="liveInfo">4 sensors shown</strong></div>
</div>

<script>
const sensors = {
    temp: { name: 'Temperature', unit: '°C', data: [18,19,20,21,22,23,24,25,24,23,22,21,20,19,18,17,18,19,20,21,22,23,24], color: '#ef4444' },
    humidity: { name: 'Humidity', unit: '%', data: [45,48,50,52,55,58,60,62,60,58,55,52,50,48,46,45,45,47,50,53,56,59,62], color: '#3b82f6' },
    pressure: { name: 'Pressure', unit: 'hPa', data: [1013,1012,1013,1014,1015,1016,1017,1018,1017,1016,1015,1014,1013,1012,1011,1010,1011,1012,1013,1014,1015,1016,1017], color: '#8b5cf6' },
    co2: { name: 'CO2', unit: 'ppm', data: [400,405,410,415,420,425,430,435,430,425,420,415,410,405,400,395,400,405,410,415,420,425,430], color: '#f59e0b' }
};

let currentSensor = 'temp';
let mainChart, distChart;

function selectSensor(sensor) {
    currentSensor = sensor;
    document.querySelectorAll('.sensor-list-item').forEach((el, i) => {
        el.classList.toggle('active', Object.keys(sensors)[i] === sensor);
    });
    updateCharts();
}

function updateMetrics() {
    const s = sensors[currentSensor];
    const data = s.data;
    const grid = document.getElementById('metricsGrid');
    grid.innerHTML = `
        <div class="metric-card">
            <div class="metric-label">Current</div>
            <div class="metric-value" style="color:${s.color}">${data[data.length-1]}<span class="metric-unit">${s.unit}</span></div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Average</div>
            <div class="metric-value" style="color:${s.color}">${(data.reduce((a,b)=>a+b)/data.length).toFixed(1)}<span class="metric-unit">${s.unit}</span></div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Min</div>
            <div class="metric-value" style="color:${s.color}">${Math.min(...data)}<span class="metric-unit">${s.unit}</span></div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Max</div>
            <div class="metric-value" style="color:${s.color}">${Math.max(...data)}<span class="metric-unit">${s.unit}</span></div>
        </div>
    `;
}

function updateCharts() {
    const s = sensors[currentSensor];
    const hours = Array.from({length:24}, (_,i) => `${i}h`);
    
    if (mainChart) mainChart.destroy();
    mainChart = new Chart(document.getElementById('mainChart'), {
        type: 'line',
        data: {
            labels: hours,
            datasets: [{
                label: s.name,
                data: s.data,
                borderColor: s.color,
                backgroundColor: s.color + '20',
                tension: 0.4,
                fill: true,
                borderWidth: 2,
                pointRadius: 3,
                pointBackgroundColor: s.color
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: false, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
            }
        }
    });

    if (distChart) distChart.destroy();
    distChart = new Chart(document.getElementById('distChart'), {
        type: 'doughnut',
        data: {
            labels: ['Normal', 'Warning', 'Optimal'],
            datasets: [{
                data: [60, 20, 20],
                backgroundColor: [s.color, '#f59e0b', '#10b981'],
                borderColor: '#1e293b',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#94a3b8' } } }
        }
    });

    updateMetrics();
}

// Initialize
updateCharts();
</script>
</body>
</html>
